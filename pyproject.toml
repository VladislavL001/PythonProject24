[project]
name = "pythonproject24"
version = "0.1.0"
description = ""
authors = [
    {name = "Vlad",email = "vlad-labytin@yandex.ru"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "stripe (>=15.3.0,<16.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "django-stubs (>=6.0.6,<7.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)"
]
dev = [
    "coverage (>=7.15.0,<8.0.0)"
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]

ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings"