name: CI

on:
  push:
    branches:
      - feature/homework_24
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lms"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Django tests
        working-directory: myproject
        env:
          SECRET_KEY: django-insecure-ci-test-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: lms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          STRIPE_SECRET_KEY: ""
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: "587"
          EMAIL_HOST_USER: ""
          EMAIL_HOST_PASSWORD: ""
          EMAIL_USE_TLS: "True"
          DEFAULT_FROM_EMAIL: ""
        run: poetry run python manage.py test

      - name: Run Flake8
        run: poetry run flake8 .

      - name: Build Docker image
        run: docker build -t pythonproject24:test .
